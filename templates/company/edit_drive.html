{% extends "base.html" %}

{% block title %}Edit Placement Drive - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Edit Placement Drive</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('company.modify_drive', drive_id=drive.id) }}">
                    <div class="mb-3">
                        <label for="job_title" class="form-label">Job Title</label>
                        <input type="text" class="form-control" id="job_title"
                               name="job_title" value="{{ drive.job_title }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="job_description" class="form-label">Job Description</label>
                        <textarea class="form-control" id="job_description" name="job_description"
                                  rows="5" required>{{ drive.job_description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="eligibility" class="form-label">Eligibility Criteria</label>
                        <textarea class="form-control" id="eligibility" name="eligibility"
                                  rows="3" required>{{ drive.eligibility }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="application_deadline" class="form-label">Application Deadline</label>
                        <input type="date" class="form-control" id="application_deadline"
                               name="application_deadline" value="{{ drive.application_deadline }}" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('company.company_dashboard_page') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning">Update Drive</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
