{% extends "base.html" %}

{% block title %}Login - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Login to Your Account</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.user_login') }}">
                    <div class="mb-3">
                        <label for="user_type" class="form-label">Login As</label>
                        <select class="form-select" id="user_type" name="user_type" required>
                            <option value="">Select user type</option>
                            <option value="admin">Admin</option>
                            <option value="company">Company</option>
                            <option value="student">Student</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email_or_username" class="form-label">Email / Username</label>
                        <input type="text" class="form-control" id="email_or_username"
                               name="email_or_username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password"
                               name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <hr>
                <div class="text-center">
                    <p class="mb-0">Don't have an account?</p>
                    <a href="{{ url_for('auth.student_registration') }}" class="btn btn-link">Register as Student</a>
                    <a href="{{ url_for('auth.company_registration') }}" class="btn btn-link">Register as Company</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
