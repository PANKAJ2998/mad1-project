{% extends "base.html" %}

{% block title %}Company Registration - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Company Registration</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.register_company') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Company Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Company Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label for="hr_contact" class="form-label">HR Contact Number</label>
                        <input type="tel" class="form-control" id="hr_contact" name="hr_contact" required>
                    </div>

                    <div class="mb-3">
                        <label for="website" class="form-label">Company Website</label>
                        <input type="url" class="form-control" id="website" name="website"
                               placeholder="https://example.com">
                    </div>

                    <div class="alert alert-info">
                        <small>Your registration will be reviewed by the admin before you can login.</small>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>

                <hr>
                <div class="text-center">
                    <p class="mb-0">Already have an account?</p>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
